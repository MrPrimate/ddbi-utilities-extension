<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>DDBI Utilities</title>
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 12px;
        font: 13px/1.4 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      button {
        width: 100%;
        height: 32px;
        cursor: pointer;
      }
      #status {
        margin: 8px 0 0;
        min-height: 1.4em;
      }
      #status[data-kind="ok"] {
        color: #1a7f37;
      }
      #status[data-kind="error"],
      #foundry-status[data-kind="error"] {
        color: #b42318;
      }
      #page-import-status[data-kind="error"] {
        color: #b42318;
      }
      #foundry-status[data-kind="ok"],
      #page-import-status[data-kind="ok"] {
        color: #1a7f37;
      }
      .hint {
        margin: 4px 0 8px;
        font-size: 12px;
        opacity: 0.8;
      }
      h2 {
        margin: 12px 0 6px;
        font-size: 13px;
      }
      body.wide {
        width: 340px;
      }
      .checklist {
        margin: 4px 0 8px;
        padding: 0;
        list-style: none;
        max-height: 180px;
        overflow-y: auto;
      }
      .checklist li label {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        margin: 2px 0;
      }
      .checklist .source-name {
        opacity: 0.7;
        font-size: 11px;
      }
      .links {
        font-weight: normal;
        font-size: 11px;
      }
      #cancel-class {
        margin-top: 4px;
      }
      #connected-sites {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
      }
      #connected-sites li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-top: 4px;
        word-break: break-all;
      }
      #connected-sites button {
        width: auto;
        height: 24px;
        flex: none;
      }
    </style>
  </head>
  <body>
    <h1>DDBI Utilities</h1>
    <button id="copy-cobalt" type="button">Copy Cobalt Cookie</button>
    <p id="status" role="status"></p>
    <section id="page-import" hidden>
      <h2 id="page-import-name">D&amp;D Beyond entry</h2>
      <button id="import-entry" type="button" disabled>Add to Foundry</button>
      <p class="hint" id="import-entry-hint"></p>
      <button id="send-biography" type="button" hidden disabled>Send biography</button>
      <p class="hint" id="send-biography-hint" hidden>Adds or updates it with this page's biography and lair text, replacing D&amp;D Beyond's.</p>
      <p id="page-import-status" role="status"></p>
      <div id="subclass-picker" hidden>
        <h2>Source books</h2>
        <ul class="checklist" id="subclass-sources"></ul>
        <h2>Subclasses <span class="links"><a href="#" id="subclass-all">all</a> / <a href="#" id="subclass-none">none</a></span></h2>
        <ul class="checklist" id="subclass-list"></ul>
        <button id="import-class" type="button" disabled>Add to Foundry</button>
        <button id="cancel-class" type="button">Cancel</button>
      </div>
    </section>
    <section id="foundry" hidden>
      <h2>Foundry sites</h2>
      <p id="foundry-current"></p>
      <button id="connect-site" type="button" hidden>Connect this Foundry</button>
      <p id="foundry-status" role="status"></p>
      <ul id="connected-sites"></ul>
    </section>
    <script src="cobalt.js"></script>
    <script src="../foundry-sites.js"></script>
    <script src="connect.js"></script>
    <script src="page-import.js"></script>
  </body>
</html>
