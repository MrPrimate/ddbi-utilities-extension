name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Package
        run: zip -r ddbi-utilities-extension.zip manifest.json src icons LICENSE README.md
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: false
          name: Release ${{ steps.version.outputs.version }}
          tag: ${{ steps.version.outputs.version }}
          artifacts: ddbi-utilities-extension.zip
          token: ${{ secrets.GITHUB_TOKEN }}
